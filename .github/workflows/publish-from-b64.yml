name: Publish Timekeep from b64 tarball parts
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble tarball and publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(ls _tarball/part_* | wc -l)
          echo "parts=$count"
          test "$count" -ge 50
          cat _tarball/part_* | base64 -d > /tmp/site.tar.gz
          mkdir -p /tmp/site
          tar -xzf /tmp/site.tar.gz -C /tmp/site
          touch /tmp/site/.nojekyll
          ls -la /tmp/site /tmp/site/assets
          cd /tmp/site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Timekeep from b64 tarball"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
          gh api -X POST repos/${{ github.repository }}/pages -f build_type=legacy -f "source[branch]=gh-pages" -f "source[path]=/" || \
          gh api -X PUT repos/${{ github.repository }}/pages -f build_type=legacy -f "source[branch]=gh-pages" -f "source[path]=/" || true
