name: Enable Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST repos/${{ github.repository }}/pages -f build_type=legacy -f "source[branch]=gh-pages" -f "source[path]=/" \
            || gh api -X PUT repos/${{ github.repository }}/pages -f build_type=legacy -f "source[branch]=gh-pages" -f "source[path]=/" \
            || true
          gh api repos/${{ github.repository }}/pages
